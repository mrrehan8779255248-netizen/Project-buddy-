name: Live Vercel smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check styled homepage
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://projectbuddy-web.vercel.app"
          homepage_ok=0
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --max-time 20 -o /tmp/projectbuddy-home.html -w '%{http_code}' "$BASE_URL/" || true)"
            if [[ "$code" == "200" ]] && grep -qi "ProjectBuddy" /tmp/projectbuddy-home.html; then
              homepage_ok=1
              break
            fi
            echo "Homepage is not ready yet (HTTP $code), attempt $attempt/20"
            sleep 5
          done
          test "$homepage_ok" = "1"
          grep -q 'profileDetailsSection' /tmp/projectbuddy-home.html
          grep -q 'editProfilePictureFile' /tmp/projectbuddy-home.html
          grep -q 'editCoverImageFile' /tmp/projectbuddy-home.html
          echo "Homepage: HTTP 200; profile photo, cover upload and personal details UI present"

      - name: Verify real CSS is served by Vercel CDN
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 -D /tmp/projectbuddy-css.headers -o /tmp/projectbuddy-style.css -w '%{http_code}' https://projectbuddy-web.vercel.app/style.css)"
          echo "CSS HTTP: $code"
          grep -Eiq '^content-type:[[:space:]]*text/css' /tmp/projectbuddy-css.headers
          grep -q -- '--primary:' /tmp/projectbuddy-style.css
          grep -q '\.navbar' /tmp/projectbuddy-style.css
          grep -q '\.profile-avatar img' /tmp/projectbuddy-style.css
          grep -q '\.profile-cover-preview' /tmp/projectbuddy-style.css
          echo "CSS: correct content type, theme and profile image styles present"

      - name: Verify frontend JavaScript is served
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 -D /tmp/projectbuddy-js.headers -o /tmp/projectbuddy-app.js -w '%{http_code}' https://projectbuddy-web.vercel.app/app.js)"
          echo "JavaScript HTTP: $code"
          test "$code" = "200"
          grep -Eiq '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)' /tmp/projectbuddy-js.headers
          grep -q 'DOMContentLoaded' /tmp/projectbuddy-app.js
          grep -q 'handleProfileImageSelection' /tmp/projectbuddy-app.js
          grep -q 'editInterests' /tmp/projectbuddy-app.js
          grep -q 'editProfilePictureData' /tmp/projectbuddy-app.js
          echo "JavaScript: content type, profile photo handler and personal fields present"

      - name: Check MongoDB-backed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 25 -o /tmp/projectbuddy-health.json -w '%{http_code}' https://projectbuddy-web.vercel.app/api/health || true)"
          echo "Health endpoint HTTP: $code"
          cat /tmp/projectbuddy-health.json || true
          test "$code" = "200"
          jq -e '.status == "ok" and .database == "connected"' /tmp/projectbuddy-health.json

      - name: Check API validation without creating an account
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 25 -o /tmp/projectbuddy-validation.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' https://projectbuddy-web.vercel.app/api/auth/register || true)"
          echo "Empty registration validation HTTP: $code"
          cat /tmp/projectbuddy-validation.json || true
          test "$code" = "400"
          jq -e '.message == "Name is required"' /tmp/projectbuddy-validation.json

      - name: Report email recovery readiness
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 25 -o /tmp/projectbuddy-recovery.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"email":"smoke-test@projectbuddy.invalid"}' https://projectbuddy-web.vercel.app/api/auth/forgot-password || true)"
          if [[ "$code" == "503" ]]; then
            echo "::warning::Password recovery requires SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, and EMAIL_FROM in Vercel."
            cat /tmp/projectbuddy-recovery.json || true
          elif [[ "$code" == "200" ]]; then
            echo "Recovery endpoint returned generic success; no account was created by this test."
          else
            echo "Recovery endpoint returned HTTP $code"
            cat /tmp/projectbuddy-recovery.json || true
            exit 1
          fi

      - name: Check source JavaScript syntax and synchronized assets
        uses: actions/checkout@v4

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          node --check project/server.js
          node --check project/app.js
          node --check project/public/app.js
          node --check project/models/User.js
          node --check project/routes/auth.js
          node --check project/routes/users.js
          cmp project/app.js project/public/app.js
          cmp project/style.css project/public/style.css
          echo "Syntax checks passed; public frontend assets match source files."
