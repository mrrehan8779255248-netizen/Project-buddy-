name: Materialize ProjectBuddy source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize ProjectBuddy source')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Reconstruct and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/source-*.b64 | base64 --decode > /tmp/ProjectBuddy_Vercel_Source.zip
          unzip -t /tmp/ProjectBuddy_Vercel_Source.zip
          unzip -o -q /tmp/ProjectBuddy_Vercel_Source.zip -d .
          test -f project/index.js
          test -f project/package.json
          test ! -f project/.env
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize ProjectBuddy source"
          git push
